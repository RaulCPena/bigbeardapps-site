# PR gates only. Mirrors tools/install-hooks.sh pre-push guard.
# No deploy step: merging to main deploys via the Hostinger webhook.
name: checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Generated regions up to date
        run: python3 tools/sync.py --check
      - name: Site audit
        run: python3 tools/audit.py
