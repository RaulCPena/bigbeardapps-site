# Public config for Cloudflare Analytics (GraphQL)
[vars]
CF_ZONE_ID = "96b8066d3f9c5a79927c3620fd6e6b39"
# JSON list of zones to chart (needs Analytics:Read on each)
CF_ZONES = '[{"name":"bigbeardapps.com","id":"96b8066d3f9c5a79927c3620fd6e6b39"},{"name":"feastmark.app","id":"3c37791c02da03773c0d9ce171bfab50"},{"name":"feastmark.com","id":"2f9890cf4e5fa28f32e2856e29133441"},{"name":"gunmark.app","id":"de13aa399c766ea770180f2ede5a6c2f"},{"name":"huntmark.app","id":"39eff760ed66b5b9d101e27bca1dec02"}]'

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "ops-auth-db"
database_id = "9e9c7904-307c-4997-9938-a4a3416317f6"

# Production secrets (set via wrangler secret put)
